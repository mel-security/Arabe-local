apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace "com.arablocal.app"
    compileSdkVersion rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.arablocal.app"
        minSdkVersion 26          // Android 8+ requis (MediaPipe + performances LLM)
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Augmenter la taille de la JVM heap pour charger le modèle
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    // Autoriser les fichiers de modèle volumineux dans les assets
    aaptOptions {
        noCompress "bin", "gguf", "task"
    }

    // Diviser l'APK par ABI pour réduire la taille
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'x86_64'
            universalApk true
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    // Capacitor Core
    implementation project(':capacitor-android')

    // Kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"

    // Android Core
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation 'com.google.android.material:material:1.11.0'

    // ============================================================
    // MediaPipe LLM Inference API (Gemma 2B on-device)
    // ============================================================
    implementation 'com.google.mediapipe:tasks-genai:0.10.14'

    // ============================================================
    // SQLite (via CapacitorSQLite)
    // ============================================================
    implementation 'com.capacitorjs:sqlite:6.0.1'

    // Lifecycle
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0"

    // Filesystem
    implementation "androidx.documentfile:documentfile:1.0.1"

    // Tests
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
